<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <title>Catatan Keuangan - DompetKu</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-bar {
            display: grid;
            grid-template-columns: 1.2fr 1fr 0.9fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .summary-filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .summary-filter-card {
            background: var(--white);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        }

        .summary-filter-label {
            font-size: 11px;
            color: var(--grey);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .summary-filter-value {
            font-size: 15px;
            font-weight: 800;
        }

        /* Daftar Item Belanja di Form */
        .trx-items-wrapper {
            background: var(--bg-app);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .trx-item-row {
            background: var(--white);
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trx-item-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trx-item-bottom {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 8px;
        }

        .mini-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--grey);
            margin-bottom: 3px;
        }

        .trx-total-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .trx-total-banner span:last-child {
            font-size: 16px;
            color: #1d4ed8;
        }

        /* Tampilan Rincian Item di Riwayat */
        .trx-detail-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 10px;
            margin: 8px 0 10px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trx-detail-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .trx-detail-line:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .trx-detail-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .trx-time-badge {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .trx-item-title {
            color: #1e293b;
            font-weight: 500;
            word-break: break-word;
        }

        .trx-item-price {
            color: #334155;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .trx-count-pill {
            background: #f1f5f9;
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 999px;
            margin-left: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-title">
            <span>Catatan Keuangan</span>
            <a href="profile.html" class="header-avatar" id="headerAvatar"
                style="width: 34px; height: 34px; font-size: 14px;">U</a>
        </div>

        <div class="tabs">
            <button type="button" class="tab-btn" id="btnTabCatat" onclick="switchTabTrx('catat')">Catat Baru</button>
            <button type="button" class="tab-btn active" id="btnTabRiwayat"
                onclick="switchTabTrx('riwayat')">Riwayat</button>
        </div>

        <!-- TAB 1: FORM CATAT / EDIT TRANSAKSI -->
        <div id="tabCatat" class="tab-content card">
            <h3 id="formTitleTrx">Catat Transaksi Baru</h3>
            <form id="transaksiForm">
                <input type="hidden" id="trxId">

                <div class="form-row">
                    <div class="form-group">
                        <label>Jenis Transaksi</label>
                        <select id="trxType" class="form-control" required onchange="updateCategoryOptions()">
                            <option value="Pengeluaran">💸 Pengeluaran</option>
                            <option value="Pemasukan">💰 Pemasukan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="trxDate" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="trxCategory" class="form-control" required
                            onchange="updateSubCategorySuggestions()"></select>
                    </div>
                    <div class="form-group">
                        <label>Judul / Sub-Kategori</label>
                        <input type="text" id="trxCategoryDetail" class="form-control" list="subCategoryList" required
                            placeholder="Contoh: Sarapan, Belanja Harian">
                        <datalist id="subCategoryList"></datalist>
                    </div>
                </div>

                <!-- Rincian Item Belanja + Jam Otomatis -->
                <div class="trx-items-wrapper">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label style="font-weight: 700; font-size: 13px; color: var(--dark-grey); margin: 0;">
                            🧾 Rincian Belanja / Item
                        </label>
                        <span id="trxItemCountLabel" style="font-size: 11px; color: var(--grey); font-weight: 600;">1
                            item</span>
                    </div>
                    <p style="font-size: 11px; color: var(--grey); margin-bottom: 10px;">
                        Jika ada pengeluaran tambahan di hari yang sama, klik <strong>+ Tambah Belanja Lagi</strong>.
                        Jam akan terisi otomatis.
                    </p>

                    <div id="trxItemsContainer"></div>

                    <button type="button" class="btn btn-outline btn-sm"
                        style="background: var(--white); width: 100%; justify-content: center;"
                        onclick="addTrxItemRow('', '', null, true)">
                        + Tambah Belanja Lagi
                    </button>

                    <div class="trx-total-banner">
                        <span>Total Nominal Hari Ini:</span>
                        <span id="trxTotalPreview">Rp 0</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-1" id="btnSubmitTrx">Simpan Transaksi</button>
                <button type="button" class="btn btn-outline mt-1" id="btnCancelEditTrx" style="display:none;"
                    onclick="cancelEditTrx()">Batal Edit</button>
            </form>
        </div>

        <!-- TAB 2: RIWAYAT TRANSAKSI -->
        <div id="tabRiwayat" class="tab-content active">
            <input type="text" id="searchTrx" class="search-box"
                placeholder="Cari keterangan, item belanja, atau kategori...">

            <div class="filter-bar">
                <select id="filterType" class="form-control" style="padding: 9px 10px; font-size: 13px;">
                    <option value="all">Semua Jenis</option>
                    <option value="Pemasukan">Pemasukan</option>
                    <option value="Pengeluaran">Pengeluaran</option>
                </select>
                <select id="filterMonth" class="form-control" style="padding: 9px 10px; font-size: 13px;">
                    <option value="all">Semua Bulan</option>
                    <option value="01">Januari</option>
                    <option value="02">Februari</option>
                    <option value="03">Maret</option>
                    <option value="04">April</option>
                    <option value="05">Mei</option>
                    <option value="06">Juni</option>
                    <option value="07">Juli</option>
                    <option value="08">Agustus</option>
                    <option value="09">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">Desember</option>
                </select>
                <select id="filterYear" class="form-control" style="padding: 9px 10px; font-size: 13px;"></select>
            </div>

            <div class="summary-filter-grid">
                <div class="summary-filter-card">
                    <div class="summary-filter-label">Masuk (Filter)</div>
                    <div class="summary-filter-value text-success" id="filteredIncome">Rp 0</div>
                </div>
                <div class="summary-filter-card">
                    <div class="summary-filter-label">Keluar (Filter)</div>
                    <div class="summary-filter-value text-danger" id="filteredExpense">Rp 0</div>
                </div>
            </div>

            <div id="transactionList" class="card"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
            Home
        </a>
        <a href="transaksi.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path
                    d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" />
            </svg>
            Keuangan
        </a>
        <a href="aktivitas.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path
                    d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
            Aktivitas
        </a>
        <a href="wishlist.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
            </svg>
            Target
        </a>
        <a href="habit.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path
                    d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z" />
            </svg>
            Habit
        </a>
    </nav>

    <script src="js/storage.js"></script>
    <script src="js/transaksi.js"></script>
</body>

</html>
