<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <title>Daftar Akun - DompetKu</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper container">
        <div class="card auth-box">
            <img src="assets/icon.svg" alt="DompetKu" class="brand-badge">
            <h2 class="text-center" style="margin-bottom: 4px;">Buat Akun Baru</h2>
            <p class="text-center mb-1" style="font-size: 13px; color: var(--grey);">
                Seluruh data tersimpan aman di perangkat Anda
            </p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="name" class="form-control" required placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" required minlength="4"
                            placeholder="Minimal 4 karakter">
                        <button type="button" class="toggle-pwd-btn"
                            onclick="togglePassword('password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-1">Daftar Akun</button>
            </form>

            <div class="text-center auth-links">
                Sudah punya akun? <a href="index.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
