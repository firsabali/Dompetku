<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Masuk - DompetKu</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper container">
        <div class="card auth-box">
            <img src="assets/icon.svg" alt="DompetKu" class="brand-badge">
            <h2 class="text-center" style="margin-bottom: 4px;">Masuk ke DompetKu</h2>
            <p class="text-center mb-1" style="font-size: 13px; color: var(--grey);">
                Kelola keuangan, aktivitas, target & habit secara offline
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" required
                            placeholder="Masukkan password">
                        <button type="button" class="toggle-pwd-btn"
                            onclick="togglePassword('password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-1">Masuk Aplikasi</button>
            </form>

            <div class="text-center auth-links">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
